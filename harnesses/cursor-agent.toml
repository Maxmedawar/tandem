# Cursor CLI (Cursor's terminal agent), program `cursor-agent`: the installer's legacy name; its
# primary name `agent` is Grok's on mini, and the name `cursor` fails lint-agents rule A. Checked
# against the Cursor CLI package 2026.11.11-043ef28 (read as text) and Cursor's CLI docs; never
# run for this file. idle is the input box's placeholder after `→` (`Plan, search, build anything`
# on the first turn, `Add a follow-up` later), from the UI strings; unproven on a real screen until
# the live row runs. working is the running box's `ctrl+c to stop`. waiting_for_approval is the
# command approval's `Run (once)` / `(esc or n)` rows, a file write's `(esc or n or p)` row and a
# delete's `Keep (n)` row (one approval list, its own keys); approve is `y`, deny is `n`. interrupt is
# one C-c; a second C-c exits. account_env is unset: the login follows HOME, not
# CURSOR_CONFIG_DIR. The dialog row `workspace-trust` answers the workspace-trust menu with its
# `[a]` key, `Trust this workspace`, which trusts this folder only; it is typed only during start and
# only where the limits file allows `trust`. delivery is `notice`: Cursor's hooks live in its own
# config, which Tandem never writes.
name = "cursor-agent"
program = "cursor-agent"
has_prompts = true
skip_prompts_args = ["--force"]
resume = ["--resume", "{id}"]
history = "~/.cursor/chats"
delivery = "notice"

[states]
# U-R1B-ANCHOR: an open decision hides the prompt bar (2026.11.11 UI code, U-R1B-CURSOR audit), so an
# approval row counts only when no bar or box opens after it (no `┌` or `▄` row) to the screen end.
waiting_for_approval = ['Run (?:outside sandbox )?\(once\)[^\n]*(?:\n[ \t]*(?:[^ \t┌▄\n][^\n]*)?)*\z', '\(esc or n(?: or p)?\)[^\n]*(?:\n[ \t]*(?:[^ \t┌▄\n][^\n]*)?)*\z', 'Keep \(n\)[^\n]*(?:\n[ \t]*(?:[^ \t┌▄\n][^\n]*)?)*\z']
# U-R1B-ANCHOR: the stop hint and the placeholder count only on the prompt row in use: no later row
# opens a bar or box (`┌`, `▄`) or is a prompt row (`│`, `→`) to the screen end, like empty_prompt.
working = ['(?i)ctrl\+c to stop[^\n]*(?:\n[ \t]*(?:[^ \t│→┌▄\n][^\n]*)?)*\z']
idle = ['→ (?:Plan, search, build anything|Add a follow-up)[^\n]*(?:\n[ \t]*(?:[^ \t│→┌▄\n][^\n]*)?)*\z']
# U-R1A-18D: an agent's text enters only an empty prompt (the → row, boxed or padded, shows only its placeholder, and no later row is a prompt).
empty_prompt = ['^(?:│ |[ \t]*)→ (?:Plan, search, build anything|Add a follow-up(?: — /plan to review and build)?)[ \t]*(?:│[ \t]*)?(?:\n[ \t]*(?:[^ \t│→\n][^\n]*)?)*\z']

[keys]
interrupt = ["C-c"]
approve = "y"
deny = "n"

[[dialogs]]
name = "workspace-trust"
kind = "trust"
match = ['Workspace Trust Required', 'Do you trust the contents of this directory\?']
answer = "Trust this workspace"
key = "a"
