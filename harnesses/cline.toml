# Cline CLI (Cline 3.x, its interactive terminal UI), program `cline`. Checked against cline 3.0.74
# (the npm package, its darwin-arm64 binary and the cli-v3.0.74 source, read as text, never run).
# args `--auto-approve false`: Cline's own default approves every tool, and Tandem's default is to
# ask; skip prompts appends `--auto-approve true` (Cline's flag parsing is last-wins). idle is the
# `❯` input bar with one of its four placeholders (home `What can I do for you?` / chat
# `Ask anything...`, `Plan something...` in plan mode on both), unanchored because the home view is
# centred; no rule reads the status bar.
# Unproven on a real screen until the live row runs. working is `Thinking... (esc to cancel)` after
# its spinner frame (so a reply that quotes it is not working) or a
# `dots` spinner frame in the transcript gutter, because the thinking line goes as soon as content
# streams while the placeholder still shows. waiting_for_approval is the inline
# `Cline needs permission` box, one form for every tool and the plan-to-act switch; the box
# replaces the input bar, so each approval pattern also requires no `❯` after it (`[^❯]*\z`): reply
# text that quotes these phrases sits above the input bar and stays idle; approve is `y`,
# deny is `n`. interrupt is one Escape; two Escapes restore a checkpoint. account_env is
# CLINE_DIR. Pop-ups (director ruling R1): the hub update dialogs (`Cline Hub was updated`,
# `Cline Hub update required`) and the startup notices (`Try ClinePass`, `Introducing Cline Desktop`)
# are drawn centred over a see-through backdrop, so the chat's input bar stays visible below them and
# Enter would update Cline, replace the shared hub or open a browser. Each reads waiting_for_approval
# (typing held, the owner alerted) when its title and, within 24 lines below, its full `Press Enter to`
# footer both show; a reply that quotes a footer reads idle. The `[^❯]*\z` guard cannot be used here
# because the input bar is below the pop-up. y and n do nothing in the hub dialogs: the owner answers
# there. debounce_ms 5000 (ruling R2): a long reply or reasoning pushes its only spinner out of the
# 40-line window, so idle must hold through a 4 s model pause. KNOWN LIMIT: a pause longer than 5 s
# in such a reply still reads idle until the hook-delivery turn-end signal (U-R1A-26/27) is used.
# No dialog row: Cline has no trust menu, and its onboarding and hub update menus are not dialogs
# Tandem may answer. delivery is `notice`: Cline's hooks live in its own folders,
# which Tandem never writes.
name = "cline"
program = "cline"
args = ["--auto-approve", "false"]
has_prompts = true
skip_prompts_args = ["--auto-approve", "true"]
resume = ["--id", "{id}"]
account_env = "CLINE_DIR"
history = "~/.cline/data/sessions"
delivery = "notice"

[states]
waiting_for_approval = [
  'Cline needs permission[^❯]*\z', 'Approve tool call\?[^❯]*\z', '\[y\] [Aa]pprove +\[n\] [Dd]eny[^❯]*\z',
  'Cline Hub was updated[^\n]*(?:\n[^\n]*){1,24}?Press Enter to update and restart, Esc to dismiss',
  'Cline Hub update required[^\n]*(?:\n[^\n]*){1,24}?Press Enter to update now, Esc to keep the Hub running',
  '(?:Try ClinePass|Introducing Cline Desktop)[^\n]*(?:\n[^\n]*){1,24}?Press Enter to open, any other key to close',
]
working = ['(?m)^[ │]*[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] Thinking\.\.\. \(esc to cancel\)', '(?m)^[ │]*[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] ']
debounce_ms = 5000
idle = ['❯ +(?:What can I do for you\?|Ask anything\.\.\.|Plan something\.\.\.)']

[keys]
interrupt = ["Escape"]
approve = "y"
deny = "n"
