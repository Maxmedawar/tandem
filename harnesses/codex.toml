# Codex CLI. Screen rules adapted from kbwo/ccmanager src/services/stateDetector/codex.ts (MIT,
# see test/fixtures/screens/NOTICE); the same patterns as test/fixtures/screens/harnesses/codex.toml.
# idle is a positive match of the prompt: a `› ` composer line with the `? for shortcuts` hint below
# it (codex-cli 0.166.0). debounce_ms is Codex's stability floor (5000 ms). Codex's footer says
# `esc to interrupt`, so interrupt is Escape. skip_prompts_args is data only until U-R1A-17.
name = "codex"
program = "codex"
has_prompts = true
skip_prompts_args = ["--dangerously-bypass-approvals-and-sandbox"]
resume = ["resume", "{id}"]
fork = ["fork", "{id}"]
account_env = "CODEX_HOME"
history = "~/.codex/sessions"
# U-R1A-26: Codex 0.167.1 has hooks; Tandem passes its own, and their trust record, as --config values.
delivery = "hook"
hook = "--config"
hook_format = "config-overrides"
# U-R1A-36C: Codex starts a stdio MCP server with a short default environment plus the server's
# `env_vars` (its 0.167.1 binary's text holds "env_vars entry" and the default list LOGNAME SHELL
# __CF_USER_TEXT_ENCODING LC_ALL TMPDIR TZ ...), so Tandem registers its own `tandem` server for the
# session through --config values naming TANDEM_CALLER_TOKEN among its env_vars; `codex mcp get
# tandem --json` under an empty CODEX_HOME listed that command, those args and those env_vars.
mcp_env = "config-overrides"

[states]
waiting_for_approval = [
  # U-R1B-ANCHOR: the approval ends the screen: no composer row (`› ` and text, not a numbered option) after it, then \z.
  '(?i)press enter to confirm or esc to cancel[^\n]*(?:\n(?:[^›\n][^\n]*|›[ \t]*\d[^\n]*)?)*\z',
  # U-R1B-ANCHOR: the approval ends the screen: no composer row (`› ` and text, not a numbered option) after it, then \z.
  '(?i)confirm with .+ enter[^\n]*(?:\n(?:[^›\n][^\n]*|›[ \t]*\d[^\n]*)?)*\z',
  # U-R1B-ANCHOR: the approval ends the screen: no composer row (`› ` and text, not a numbered option) after it, then \z.
  '(?i)allow command\?[^\n]*(?:\n(?:[^›\n][^\n]*|›[ \t]*\d[^\n]*)?)*\z',
  # U-R1B-ANCHOR: the approval ends the screen: no composer row (`› ` and text, not a numbered option) after it, then \z.
  '(?i)\[y/n\][^\n]*(?:\n(?:[^›\n][^\n]*|›[ \t]*\d[^\n]*)?)*\z',
  # U-R1B-ANCHOR: the approval ends the screen: no composer row (`› ` and text, not a numbered option) after it, then \z.
  '(?i)yes \(y\)[^\n]*(?:\n(?:[^›\n][^\n]*|›[ \t]*\d[^\n]*)?)*\z',
  # U-R1B-ANCHOR: the approval ends the screen: no composer row (`› ` and text, not a numbered option) after it, then \z.
  '(?i)enter to submit[^\n]*(?:\n(?:[^›\n][^\n]*|›[ \t]*\d[^\n]*)?)*\z',
  # U-R1B-ANCHOR: the approval ends the screen: no composer row (`› ` and text, not a numbered option) after it, then \z.
  '(?i)(?:do you want|would you like)[^\n]*(?:\n(?:[^›\n][^\n]*|›[ \t]*\d[^\n]*)?)*?\n(?:[^›\n][^\n]*|›[ \t]*\d[^\n]*)?\byes\b[^\n]*(?:\n(?:[^›\n][^\n]*|›[ \t]*\d[^\n]*)?)*\z',
]
working = [
  # U-R1B-ANCHOR: the marker, at most 4 lines, then the composer row in use and its footer to \z (no other composer row between or after).
  '(?i)esc[^\n]*interrupt[^\n]*(?:\n(?:[^›\n][^\n]*)?){0,4}(?:\n›[^\n]*)?(?:\n(?:[^›\n][^\n]*|›[ \t]*\d[^\n]*)?)*\z',
]
idle = ['^› [^\n]*\n(?:[^\n]*\n){0,4}[^\n]*\? for shortcuts']
# U-R1A-18D: an agent's text enters only this composer empty: nothing typed, or codex 0.167.1's placeholder (first turn, follow-up).
# Only the composer in use counts: a blank line, at most one status line, then the footer as the last line (no text line under the row).
empty_prompt = ['^›(?:[ \t]*| (?:Ask Codex to do anything|Ask a follow-up question)[ \t]*)\n[ \t]*\n(?:[^\n]*\n)?[^\n]*\? for shortcuts[^\n]*\z']
debounce_ms = 5000

[keys]
interrupt = ["Escape"]
approve = "Enter"
deny = "Escape"

# First-run dialogs warmup may answer (SCHEMA.md `[[dialogs]]`): folder trust (0.167.1 text and the
# older text, both from the binary's strings) and the update notice, which is only ever skipped.
[[dialogs]]
name = "folder-trust"
kind = "trust"
match = ['(?i)trust this folder\?']
answer = "Trust and continue"
highlight = "›"

[[dialogs]]
name = "folder-trust-old"
kind = "trust"
match = ['(?i)do you trust the contents of this directory']
answer = "Yes, continue"
highlight = "›"

[[dialogs]]
name = "update"
kind = "update"
match = ['(?i)update available']
answer = "Skip"
highlight = "›"
