# Codex CLI. Screen rules adapted from kbwo/ccmanager src/services/stateDetector/codex.ts (MIT,
# see test/fixtures/screens/NOTICE); the same patterns as test/fixtures/screens/harnesses/codex.toml.
# idle is a positive match of the prompt: a `› ` composer line with the `? for shortcuts` hint below
# it (codex-cli 0.166.0). debounce_ms is Codex's stability floor (5000 ms). Codex's footer says
# `esc to interrupt`, so interrupt is Escape. skip_prompts_args is data only until U-R1A-17.
name = "codex"
program = "codex"
has_prompts = true
skip_prompts_args = ["--dangerously-bypass-approvals-and-sandbox"]
resume = ["resume", "{id}"]
fork = ["fork", "{id}"]
account_env = "CODEX_HOME"
history = "~/.codex/sessions"

[states]
waiting_for_approval = [
  '(?i)press enter to confirm or esc to cancel',
  '(?i)confirm with .+ enter',
  '(?i)allow command\?',
  '(?i)\[y/n\]',
  '(?i)yes \(y\)',
  '(?i)enter to submit',
  '(?i)(?:do you want|would you like)[\s\S]*?\n+[\s\S]*?\byes\b',
]
working = ['(?i)esc.*interrupt']
idle = ['^› [^\n]*\n(?:[^\n]*\n){0,4}[^\n]*\? for shortcuts']
debounce_ms = 5000

[keys]
interrupt = ["Escape"]
approve = "Enter"
deny = "Escape"
