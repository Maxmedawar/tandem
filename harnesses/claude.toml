# Claude Code. Screen rules adapted from kbwo/ccmanager src/services/stateDetector/claude.ts (MIT,
# see test/fixtures/screens/NOTICE); the same patterns as test/fixtures/screens/harnesses/claude.toml.
# idle is a positive match of the prompt box: a `❯` line between two rule lines. An interrupt marker
# reads working only below the box's last rule line, at most 2 lines above its top rule, or with no
# box; one further up is old transcript text. debounce_ms is Claude's stability window (3 x 750 ms).
name = "claude"
program = "claude"
has_prompts = true
skip_prompts_args = ["--dangerously-skip-permissions"]
resume = ["--resume", "{id}"]
fork = ["--resume", "{id}", "--fork-session"]
account_env = "CLAUDE_CONFIG_DIR"
history = "~/.claude/projects"
delivery = "hook"
hook = "--settings"

[states]
waiting_for_approval = [
  # U-R1B-ANCHOR: the menu ends the screen: no line after it starts a border (the menu replaces the prompt box), except the one empty box of the ccmanager samples, then \z.
  '(?i)(?:do you want|would you like).+(?:\n(?:[^─\n][^\n]*)?)*?\n(?:[^─\n][^\n]*)?(?:yes|❯)[^\n]*(?:\n(?:[^─\n][^\n]*)?)*(?:\n─{20,}[ \t]*\n❯[ \t]*\n─{20,}[ \t]*)?\z',
  # U-R1B-ANCHOR: the dialog's own footer, then no line that starts a border (no prompt box) to \z.
  '(?i)esc to cancel[^\n]*(?:\n(?:[^─\n][^\n]*)?)*\z',
  # U-R1B-ANCHOR: the menu's deny row, then no line that starts a border (no prompt box) to \z.
  '(?i)\d+\.\s*deny\s*\(esc\)[^\n]*(?:\n(?:[^─\n][^\n]*)?)*\z',
]
working = [
  # U-R1B-ANCHOR: the marker, at most 2 lines, then the prompt box in use and its footer to \z (no other box between or after).
  '(?i)esc to interrupt[^\n]*(?:\n(?:[^─\n][^\n]*)?){0,2}\n─{20,}[^\n]*\n❯[^\n]*(?:\n[^─\n][^\n]*)*\n─{20,}[^\n]*(?:\n(?:[^─\n][^\n]*)?)*\z',
  '(?i)esc to interrupt[^\n]*(?:\n[^─\n][^\n]*)*\z',
  # U-R1B-ANCHOR: the marker, at most 2 lines, then the prompt box in use and its footer to \z (no other box between or after).
  '(?i)ctrl\+c to interrupt[^\n]*(?:\n(?:[^─\n][^\n]*)?){0,2}\n─{20,}[^\n]*\n❯[^\n]*(?:\n[^─\n][^\n]*)*\n─{20,}[^\n]*(?:\n(?:[^─\n][^\n]*)?)*\z',
  '(?i)ctrl\+c to interrupt[^\n]*(?:\n[^─\n][^\n]*)*\z',
  '^[✱✲✳✴✵✶✷✸✹✺✻✼✽✾✿❀❁❂❃❇❈❉❊❋✢✣✤✥✦✧✨⊛⊕⊙◉◎◍⁂⁕※⍟☼★☆·•⏺▸▹∙⋅○●] \S+ing.*…',
  '(?i)\([^)]*\d[^)]*tokens\s*\)',
]
idle = ['^─{20,}[ \t]*\n❯(?:[ \t\x{A0}][^\n]*)?\n─{20,}']
# U-R1A-18D: an agent's text enters only this box empty: nothing typed, or one of claude 2.1.321's eight placeholder templates (Try "...").
# Only the last box counts: no line after it starts a border (an older box left above the one in use is not the prompt).
empty_prompt = ['^─{20,}[ \t]*\n❯(?:[ \t\x{A0}]*|[ \t\x{A0}]Try "(?:fix lint errors|fix typecheck errors|how does [^\s"]+ work\?|refactor [^\s"]+|how do I log an error\?|edit [^\s"]+ to\.\.\.|write a test for [^\s"]+|create a util logging\.py that\.\.\.)"[ \t\x{A0}]*)\n─{20,}[^\n]*(?:\n(?:[^─\n][^\n]*)?)*\z']
debounce_ms = 2250

[keys]
interrupt = ["Escape", "C-c"]
approve = "Enter"
deny = "Escape"

# First-run dialogs warmup may answer (SCHEMA.md `[[dialogs]]`): the folder trust dialog, and the
# bypass-permissions accept dialog (only with prompts off, in a permission_skip folder).
[[dialogs]]
name = "folder-trust"
kind = "trust"
match = ['(?i)trust this folder']
answer = "Yes, I trust this folder"
highlight = "❯"

[[dialogs]]
name = "bypass-accept"
kind = "bypass"
match = ['(?i)bypass permissions mode']
answer = "Yes, I accept"
highlight = "❯"
