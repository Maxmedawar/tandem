# Claude Code. Screen rules adapted from kbwo/ccmanager src/services/stateDetector/claude.ts (MIT,
# see test/fixtures/screens/NOTICE); the same patterns as test/fixtures/screens/harnesses/claude.toml.
# idle is a positive match of the prompt box: a `❯` line between two rule lines. An interrupt marker
# reads working only below the box's last rule line, at most 2 lines above its top rule, or with no
# box; one further up is old transcript text. debounce_ms is Claude's stability window (3 x 750 ms).
name = "claude"
program = "claude"
has_prompts = true
skip_prompts_args = ["--dangerously-skip-permissions"]
resume = ["--resume", "{id}"]
fork = ["--resume", "{id}", "--fork-session"]
account_env = "CLAUDE_CONFIG_DIR"
history = "~/.claude/projects"
delivery = "hook"
hook = "--settings"

[states]
waiting_for_approval = [
  '(?i)(?:do you want|would you like).+\n+[\s\S]*?(?:yes|❯)',
  '(?i)esc to cancel',
  '(?i)\d+\.\s*deny\s*\(esc\)',
]
working = [
  '(?i)esc to interrupt[^\n]*\n(?:[^\n]*\n){0,2}─{20,}',
  '(?i)esc to interrupt[^\n]*(?:\n[^─\n][^\n]*)*\z',
  '(?i)ctrl\+c to interrupt[^\n]*\n(?:[^\n]*\n){0,2}─{20,}',
  '(?i)ctrl\+c to interrupt[^\n]*(?:\n[^─\n][^\n]*)*\z',
  '^[✱✲✳✴✵✶✷✸✹✺✻✼✽✾✿❀❁❂❃❇❈❉❊❋✢✣✤✥✦✧✨⊛⊕⊙◉◎◍⁂⁕※⍟☼★☆·•⏺▸▹∙⋅○●] \S+ing.*…',
  '(?i)\([^)]*\d[^)]*tokens\s*\)',
]
idle = ['^─{20,}[ \t]*\n❯(?:[ \t\x{A0}][^\n]*)?\n─{20,}']
# U-R1A-18D: an agent's text enters only this box empty: nothing typed, or one of claude 2.1.321's eight placeholder templates (Try "...").
empty_prompt = ['^─{20,}[ \t]*\n❯(?:[ \t\x{A0}]*|[ \t\x{A0}]Try "(?:fix lint errors|fix typecheck errors|how does [^\s"]+ work\?|refactor [^\s"]+|how do I log an error\?|edit [^\s"]+ to\.\.\.|write a test for [^\s"]+|create a util logging\.py that\.\.\.)"[ \t\x{A0}]*)\n─{20,}']
debounce_ms = 2250

[keys]
interrupt = ["Escape", "C-c"]
approve = "Enter"
deny = "Escape"

# First-run dialogs warmup may answer (SCHEMA.md `[[dialogs]]`): the folder trust dialog, and the
# bypass-permissions accept dialog (only with prompts off, in a permission_skip folder).
[[dialogs]]
name = "folder-trust"
kind = "trust"
match = ['(?i)trust this folder']
answer = "Yes, I trust this folder"
highlight = "❯"

[[dialogs]]
name = "bypass-accept"
kind = "bypass"
match = ['(?i)bypass permissions mode']
answer = "Yes, I accept"
highlight = "❯"
