# Pi, program `pi`, checked against 0.79.7 (its README, CHANGELOG and docs; never run for this
# file). idle is a positive match of the editor box (the input line between two full-width `─`
# rules) with the footer's cwd and usage lines under it, from Pi's own screenshot
# docs/images/interactive-mode.png (test/fixtures/pi-screens/NOTICE); unproven on a real 0.79.7
# screen until the live row runs. working is Pi's default `Working...` message, which an
# extension can change or hide (a known limit). Pi has no approval prompts by design ("No
# permission popups."), so no waiting_for_approval rule and no skip_prompts_args. interrupt is one
# Escape; a second Escape opens /tree, and Ctrl+C only clears the editor. delivery is `notice`:
# Pi has no hook Tandem can set without loading an extension (`-e`), left for a later unit. Pi's
# project-trust prompt text is not in its docs, so there is no dialog row.
name = "pi"
program = "pi"
has_prompts = false
resume = ["--session", "{id}"]
fork = ["--fork", "{id}"]
account_env = "PI_CODING_AGENT_DIR"
history = "~/.pi/agent/sessions"
delivery = "notice"

[states]
# U-R1B-ANCHOR: the working line counts only above the editor in use, then the editor's two rules and
# the footer to the screen end with no other rule. Between the line and the editor (pi 0.79.7 draws
# its widgets there: a blank line, then up to 10 lines and a truncation line for one widget): at most
# 4 lines that do not start with a rule, or at most 12 lines that hold no run of 20 `─` (a quoted
# editor rule, however it is indented). A reply quoting it with its editor above the editor in use
# reads idle.
working = ['Working\.\.\.[^\n]*(?:\n(?:[^─\n][^\n]*)?){0,4}\n─{3}[^\n]*(?:\n(?:[^─\n][^\n]*)?)*\n─{3}[^\n]*(?:\n(?:[^─\n][^\n]*)?)*\z', 'Working\.\.\.[^\n]*(?:\n(?:─{0,19}[^─\n])*─{0,19}){0,12}\n─{3}[^\n]*(?:\n(?:[^─\n][^\n]*)?)*\n─{3}[^\n]*(?:\n(?:[^─\n][^\n]*)?)*\z']
idle = ['─{20,}\n[^\n]*\n─{20,}\n[^\n]*\n[^\n]*(?:\d%|\?)/\d']
# U-R1A-18D: an agent's text enters only an empty prompt (a blank row between the two rules above the footer).
empty_prompt = ['─{20,}\n[ \t]*\n─{20,}\n[^\n]*\n[^\n]*(?:\d%|\?)/\d[^\n]*(?:\n(?:[^─\n][^\n]*)?)*\z']

[keys]
interrupt = ["Escape"]
