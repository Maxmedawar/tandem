# Antigravity CLI, program `agy`. Approval and working rules adapted from kbwo/ccmanager
# src/services/stateDetector/gemini.ts (MIT, see test/fixtures/screens/NOTICE): the same patterns as
# test/fixtures/screens/harnesses/gemini.toml, since agy succeeds Gemini CLI; real agy 1.5.5 shows
# `esc to cancel` below its prompt box while it works. idle is the `? for shortcuts` hint agy shows
# there when ready (real screens in test/fixtures/agy-screens/). Flags read from the binary's text.
# skip_prompts_args is data only until U-R1A-17. interrupt is Escape only, because a
# second Ctrl+C exits agy.
name = "antigravity"
program = "agy"
has_prompts = true
skip_prompts_args = ["--dangerously-skip-permissions"]
resume = ["--conversation", "{id}"]
history = "~/.gemini/antigravity-cli/conversations"

[states]
waiting_for_approval = [
  '(?i)waiting for user confirmation',
  '│ (?:Apply this change|Allow execution|Do you want to proceed)',
  '(?i)(?:allow execution|do you want to|apply this change)[\s\S]*?\n+[\s\S]*?\byes\b',
]
working = [
  # U-R1B-ANCHOR: the footer marker, then no line that starts a rule or the > prompt (no prompt box after it), to \z.
  '(?i)esc to cancel[^\n]*(?:\n(?:[^─>\n][^\n]*)?)*\z',
]
idle = ['\? for shortcuts']
# U-R1A-18D: an agent's text enters only an empty prompt (a bare > row between the two rules above `? for shortcuts`).
empty_prompt = ['^─{20,}[ \t]*\n>[ \t]*\n─{20,}[ \t]*\n\? for shortcuts[^\n]*(?:\n(?:[^─>\n][^\n]*)?)*\z']

[keys]
interrupt = ["Escape"]

# First-run dialog warmup may answer (SCHEMA.md `[[dialogs]]`): agy 1.5.4's workspace trust.
[[dialogs]]
name = "folder-trust"
kind = "trust"
match = ['(?i)do you trust the contents of this project\?']
answer = "Yes, I trust this folder"
highlight = ">"
