# Grok CLI. Screen rules adapted from kbwo/ccmanager src/services/stateDetector/grok.ts (MIT,
# see test/fixtures/screens/NOTICE); the same patterns as test/fixtures/screens/harnesses/grok.toml.
# idle and the footer working pattern come from grok 1.0.77's own screens, recorded on mini by
# test/conformance/grok.live.test.ts (test/fixtures/screens/grok-*-real*.txt).
# skip_prompts_args is data only until U-R1A-17.
name = "grok"
program = "grok"
has_prompts = true
skip_prompts_args = ["--always-approve"]
resume = ["--resume", "{id}"]
account_env = "GROK_HOME"
history = "~/.grok/sessions"

[states]
waiting_for_approval = [
  # U-R1B-ANCHOR: the menu ends the screen: no box opens after it (the composer box is gone), then \z.
  '\d/\d:select[^\n]*(?:\n[ \t]*(?:[^ \t╭\n][^\n]*)?)*\z',
  # U-R1B-ANCHOR (audit): not tied to the screen end. This marker is a status line or an option row, and grok 1.0.77
  # can keep its composer box below it (plan approval: `Type revision notes...`, key hints with no N/N:select); the
  # real screen was never recorded, so a box after it must not turn an approval into idle.
  '\([○●]\) No, reject \(type to add feedback\)',
  # U-R1B-ANCHOR: the menu ends the screen: no box opens after it (the composer box is gone), then \z.
  ':next answer[^\n]*(?:\n[ \t]*(?:[^ \t╭\n][^\n]*)?)*\z',
  # U-R1B-ANCHOR: the menu ends the screen: no box opens after it (the composer box is gone), then \z.
  ':accept / toggle[^\n]*(?:\n[ \t]*(?:[^ \t╭\n][^\n]*)?)*\z',
  # U-R1B-ANCHOR (audit): not tied to the screen end. This marker is a status line or an option row, and grok 1.0.77
  # can keep its composer box below it (plan approval: `Type revision notes...`, key hints with no N/N:select); the
  # real screen was never recorded, so a box after it must not turn an approval into idle.
  '◆ (?:Waiting on answers for|Waiting on plan approval|No plan written)',
  # U-R1B-ANCHOR: the menu ends the screen: no box opens after it (the composer box is gone), then \z.
  'Do you trust the contents of this directory[^\n]*(?:\n[ \t]*(?:[^ \t╭\n][^\n]*)?)*\z',
]
# grok 1.0.77 mid-turn (grok-working-real*.txt): a spinner line and `Ctrl+c:cancel` in the footer.
working = [
  # U-R1B-ANCHOR: the spinner, at most 4 lines, then the one-row composer box and at most 3 footer lines to \z (or no box at all); no other box between.
  '^[ \t]*[⠋⠙⠹⠸⠼⠴⠦⠧] [^\n]*(?:\n[ \t]*(?:[^ \t╭\n][^\n]*)?){0,4}(?:\n[ \t]*╭─[^\n]*╮[ \t]*\n[ \t]*│ ❯[^\n]*│[ \t]*\n[ \t]*╰─[^\n]*╯[ \t]*(?:\n[ \t]*(?:[^ \t╭\n][^\n]*)?){0,3})?\z',
  # U-R1B-ANCHOR: the footer key hint, then no box opens after it, to \z.
  'Ctrl\+c:cancel[^\n]*(?:\n[ \t]*(?:[^ \t╭\n][^\n]*)?)*\z',
]
# grok 1.0.77's composer: a one-row ❯ box with at most 3 footer lines below it, at the bottom of the
# screen; empty when ready (grok-idle-real.txt), or holding the prompt grok puts back after Ctrl+C
# cancels a turn (grok-idle-real2.txt). A ❯ box higher up, or with more rows, is not the composer.
idle = ['^[ \t]*╭─[^\n]*╮[ \t]*\n[ \t]*│ ❯[^\n]*│[ \t]*\n[ \t]*╰─[^\n]*╯[ \t]*(?:\n[^\n]*){0,3}\z']
# U-R1A-18D: an agent's text enters only an empty prompt (the composer box's ❯ row holds nothing).
empty_prompt = ['^[ \t]*╭─[^\n]*╮[ \t]*\n[ \t]*│ ❯[ \t]*│[ \t]*\n[ \t]*╰─[^\n]*╯[ \t]*(?:\n[^\n]*){0,3}\z']

[keys]
interrupt = ["Escape", "C-c"]

# First-run dialog warmup may answer (SCHEMA.md `[[dialogs]]`): grok 1.0.77's folder trust. A plain
# capture shows no highlight character, but each option ends with its own key, so key mode.
[[dialogs]]
name = "folder-trust"
kind = "trust"
match = ['Do you trust the contents of this directory\?']
answer = "Yes, proceed"
key = "y"
