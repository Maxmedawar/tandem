# Screen rules adapted from kbwo/ccmanager src/services/stateDetector/grok.ts (MIT, see ../NOTICE).
# idle is a positive match of grok 1.0.77's composer box (grok-idle-real*.txt), so ccmanager's
# `>` samples read unknown (grok-unknown-1..3). The same patterns as harnesses/grok.toml.
name = "grok"
program = "grok"
has_prompts = true

[states]
waiting_for_approval = [
  '\d/\d:select',
  '\([○●]\) No, reject \(type to add feedback\)',
  ':next answer',
  ':accept / toggle',
  '◆ (?:Waiting on answers for|Waiting on plan approval|No plan written)',
  'Do you trust the contents of this directory',
]
# grok 1.0.77 mid-turn (grok-working-real*.txt): a spinner line and `Ctrl+c:cancel` in the footer.
working = ['^\s*[⠋⠙⠹⠸⠼⠴⠦⠧] ', 'Ctrl\+c:cancel']
# grok 1.0.77's composer: a one-row ❯ box with at most 3 footer lines below it, at the bottom of the
# screen; empty when ready (grok-idle-real.txt), or holding the prompt grok puts back after Ctrl+C
# cancels a turn (grok-idle-real2.txt). A ❯ box higher up, or with more rows, is not the composer.
idle = ['^[ \t]*╭─[^\n]*╮[ \t]*\n[ \t]*│ ❯[^\n]*│[ \t]*\n[ \t]*╰─[^\n]*╯[ \t]*(?:\n[^\n]*){0,3}\z']
