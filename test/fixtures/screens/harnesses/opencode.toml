# Screen rules adapted from kbwo/ccmanager src/services/stateDetector/opencode.ts (MIT, see ../NOTICE).
# idle is a positive match of the prompt: the composer's bottom edge with the `ctrl+p commands`
# hint under it (real capture, opencode 2.2.7, ../opencode-idle-real.txt).
name = "opencode"
program = "opencode"
has_prompts = true

[states]
waiting_for_approval = ['△ Permission required', 'esc (?:dismiss|close)']
working = ['(?i)esc.*interrupt']
idle = ['╹▀+\n[^\n]*ctrl\+p commands']
