# Screen rules adapted from kbwo/ccmanager src/services/stateDetector/gemini.ts (MIT, see ../NOTICE).
# idle is what is left once nothing else matches, as in ccmanager.
name = "gemini"
program = "gemini"
has_prompts = true

[states]
waiting_for_approval = [
  '(?i)waiting for user confirmation',
  '│ (?:Apply this change|Allow execution|Do you want to proceed)',
  '(?i)(?:allow execution|do you want to|apply this change)[\s\S]*?\n+[\s\S]*?\byes\b',
]
working = ['(?i)esc to cancel']
idle = ['\A']
