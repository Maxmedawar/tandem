# Screen rules adapted from kbwo/ccmanager src/services/stateDetector/codex.ts (MIT, see ../NOTICE).
# idle is a positive match of the prompt: a `› ` composer line with the `? for shortcuts` hint
# below it (real capture, codex 0.166.0, ../codex-idle-real.txt). Its update menu also uses `› `.
name = "codex"
program = "codex"
has_prompts = true

[states]
waiting_for_approval = [
  '(?i)press enter to confirm or esc to cancel',
  '(?i)confirm with .+ enter',
  '(?i)allow command\?',
  '(?i)\[y/n\]',
  '(?i)yes \(y\)',
  '(?i)enter to submit',
  '(?i)(?:do you want|would you like)[\s\S]*?\n+[\s\S]*?\byes\b',
]
working = ['(?i)esc.*interrupt']
idle = ['^› [^\n]*\n(?:[^\n]*\n){0,4}[^\n]*\? for shortcuts']
# U-R1A-18D: an agent's text enters only this composer empty: nothing typed, or codex 0.167.1's placeholder (first turn, follow-up).
empty_prompt = ['^›(?:[ \t]*| (?:Ask Codex to do anything|Ask a follow-up question)[ \t]*)\n(?:[^\n]*\n){0,4}[^\n]*\? for shortcuts']
