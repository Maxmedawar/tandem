# Screen rules adapted from kbwo/ccmanager src/services/stateDetector/claude.ts (MIT, see ../NOTICE).
# idle is a positive match of the prompt box: a `❯` line (then a space or NBSP) between two rule lines (real capture,
# claude 2.1.321, ../claude-idle-real.txt). A footer alone is not idle. debounce_ms (default 1500) guards it.
# An interrupt marker reads working only below the box's last rule line, at most 2 lines above its top rule,
# or with no box; one further up is old transcript text (../claude-idle-stale.txt).
name = "claude"
program = "claude"
has_prompts = true

[states]
waiting_for_approval = [
  '(?i)(?:do you want|would you like).+\n+[\s\S]*?(?:yes|❯)',
  '(?i)esc to cancel',
  '(?i)\d+\.\s*deny\s*\(esc\)',
]
working = [
  '(?i)esc to interrupt[^\n]*\n(?:[^\n]*\n){0,2}─{20,}',
  '(?i)esc to interrupt[^\n]*(?:\n[^─\n][^\n]*)*\z',
  '(?i)ctrl\+c to interrupt[^\n]*\n(?:[^\n]*\n){0,2}─{20,}',
  '(?i)ctrl\+c to interrupt[^\n]*(?:\n[^─\n][^\n]*)*\z',
  '^[✱✲✳✴✵✶✷✸✹✺✻✼✽✾✿❀❁❂❃❇❈❉❊❋✢✣✤✥✦✧✨⊛⊕⊙◉◎◍⁂⁕※⍟☼★☆·•⏺▸▹∙⋅○●] \S+ing.*…',
  '(?i)\([^)]*\d[^)]*tokens\s*\)',
]
idle = ['^─{20,}[ \t]*\n❯(?:[ \t\x{A0}][^\n]*)?\n─{20,}']
# U-R1A-18D: an agent's text enters only this box empty: nothing typed, or one of claude 2.1.321's eight placeholder templates (Try "...").
empty_prompt = ['^─{20,}[ \t]*\n❯(?:[ \t\x{A0}]*|[ \t\x{A0}]Try "(?:fix lint errors|fix typecheck errors|how does [^\s"]+ work\?|refactor [^\s"]+|how do I log an error\?|edit [^\s"]+ to\.\.\.|write a test for [^\s"]+|create a util logging\.py that\.\.\.)"[ \t\x{A0}]*)\n─{20,}']
